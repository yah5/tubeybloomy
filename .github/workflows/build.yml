name: Build VST3 Plugin
on: [workflow_dispatch, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target tubeybloomy_VST3

      - name: Ad-hoc Sign & Package macOS VST3
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - "build/tubeybloomy_artefacts/Release/VST3/Tube Sniffer.vst3"
          hdiutil create -volname "Tube Sniffer" -srcfolder "build/tubeybloomy_artefacts/Release/VST3/Tube Sniffer.vst3" -ov -format UDZO "TubeSniffer-macOS.dmg"

      - name: Upload Windows VST3 Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TubeSniffer-windows-latest
          path: build/tubeybloomy_artefacts/Release/VST3/

      - name: Upload macOS DMG Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TubeSniffer-macos-latest
          path: TubeSniffer-macOS.dmg
